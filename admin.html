<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ELMENU - لوحة التحكم</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2a2a;--mut:#66726f;--line:#d9d5c9;--acc:#0f6b5c;--bad:#b3261e;--ok:#1b6b2f;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,Arial,sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 16px}h2{font-size:18px;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
input,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
input{width:100%;margin-bottom:8px}
button{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}
button.sec{background:#fff;color:var(--ink);border-color:var(--line)}
button.del{background:#fff;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #e2b33c;outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center}
.msg{padding:10px 12px;border-radius:6px;margin:10px 0}
.msg.err{background:#fbe9e7;color:var(--bad)}.msg.ok{background:#e6f4ea;color:var(--ok)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.hide{display:none}
ul.errs{margin:6px 0 0;padding-inline-start:20px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.tag{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<main>
<div class="bar"><h1>ELMENU - لوحة التحكم</h1><button id="out" class="sec hide">تسجيل الخروج</button></div>

<section id="login">
  <h2>تسجيل الدخول</h2>
  <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button id="go">دخول</button>
  <div id="lmsg"></div>
</section>

<div id="app" class="hide">
  <section>
    <h2>رفع منيو من ملف إكسيل</h2>
    <input id="file" type="file" accept=".xlsx">
    <div id="prev"></div>
  </section>
  <section>
    <h2>الأماكن</h2>
    <div id="list"></div>
  </section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== ضع بيانات مشروعك هنا (Project Settings > API) ===== */
const SUPABASE_URL = 'https://epyqtibilkphljchfffs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_DcSaZmbHOfcN7TyYZQIQiw_IM9vgAdp';   // anon فقط، ممنوع service_role
/* ========================================================= */

let db;
try {
  if (typeof supabase === 'undefined') throw new Error('تعذر تحميل مكتبة Supabase. تأكد من اتصال الإنترنت وأعد فتح الصفحة.');
  if (SUPABASE_URL.includes('PASTE') || SUPABASE_KEY.includes('PASTE')) throw new Error('لسه ما استبدلتش PASTE_PROJECT_URL و PASTE_ANON_PUBLIC_KEY بالقيم الحقيقية داخل الملف.');
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} catch (e) {
  document.getElementById('lmsg').innerHTML = '<div class="msg err">' + e.message + '<br>الرابط لازم يبدأ بـ https:// وينتهي بـ supabase.co</div>';
  throw e;
}
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const s = v => String(v ?? '').trim();
const yn = v => { v = s(v); return v === 'نعم' ? true : v === 'لا' ? false : null; };
const show = (el, html, cls) => { el.innerHTML = `<div class="msg ${cls}">${html}</div>`; };

const FIELDS = {'اسم المكان':'name','النوع':'type','نوع الأكل / التخصص':'cuisine','الحي / المنطقة':'area',
 'العنوان التفصيلي':'address','رقم الهاتف':'phone','رابط الموقع على الخريطة':'map_url','رابط فيسبوك / إنستجرام':'social_url',
 'يفتح الساعة':'opens_at','يقفل الساعة':'closes_at','متوسط تكلفة الفرد (جنيه)':'avg_cost_per_person',
 'يوجد واي فاي؟':'has_wifi','جلسات خارجية؟':'has_outdoor','مناسب للعائلات؟':'family_friendly','آخر تحديث للأسعار':'prices_updated_at'};

/* ---------- auth ---------- */
async function gate() {
  const { data } = await db.auth.getSession();
  const on = !!data.session;
  $('login').classList.toggle('hide', on);
  $('app').classList.toggle('hide', !on);
  $('out').classList.toggle('hide', !on);
  if (on) loadList();
}
$('go').onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) show($('lmsg'), 'تعذر الدخول: تأكد من البريد وكلمة المرور.', 'err'); else gate();
};
$('out').onclick = async () => { await db.auth.signOut(); gate(); };

/* ---------- parse Excel ---------- */
let current = null;
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
  current = parse(wb); render();
};

function toDate(v) {
  if (v instanceof Date) return new Date(v.getTime() + 12 * 36e5).toISOString().slice(0, 10);
  v = s(v); return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
}

function parse(wb) {
  const errs = [];
  const ps = wb.Sheets['بيانات المكان'], ms = wb.Sheets['المنيو'];
  if (!ps || !ms) return { errs: ['الملف لازم يحتوي على شيتي «بيانات المكان» و«المنيو» بنفس الأسماء.'], items: [] };
  const raw = {};
  XLSX.utils.sheet_to_json(ps, { header: 1, raw: true, defval: '' }).slice(1)
    .forEach(r => { const k = FIELDS[s(r[0])]; if (k) raw[k] = r[1]; });
  const avg = s(raw.avg_cost_per_person) === '' ? null : Number(raw.avg_cost_per_person);
  const place = {
    name: s(raw.name), type: s(raw.type) || 'مطعم', cuisine: s(raw.cuisine) || null, area: s(raw.area) || null,
    address: s(raw.address) || null, phone: s(raw.phone) || null, map_url: s(raw.map_url) || null,
    social_url: s(raw.social_url) || null, opens_at: s(raw.opens_at) || null, closes_at: s(raw.closes_at) || null,
    avg_cost_per_person: avg, has_wifi: yn(raw.has_wifi), has_outdoor: yn(raw.has_outdoor),
    family_friendly: yn(raw.family_friendly), prices_updated_at: toDate(raw.prices_updated_at)
  };
  if (!place.name) errs.push('بيانات المكان: اسم المكان فارغ.');
  if (avg !== null && (isNaN(avg) || avg < 0)) errs.push('بيانات المكان: متوسط التكلفة لازم يكون رقم.');
  if (!place.prices_updated_at) errs.push('بيانات المكان: اكتب «آخر تحديث للأسعار» بصيغة 2026-10-04.');

  const items = [], seen = new Set();
  XLSX.utils.sheet_to_json(ms, { header: 1, raw: true, defval: '' }).slice(1).forEach((r, i) => {
    if (r.every(c => s(c) === '')) return;
    const n = i + 2, sec = s(r[0]), name = s(r[1]), ps_ = s(r[3]).replace(/,/g, '');
    const price = ps_ === '' ? NaN : Number(ps_), variant = s(r[4]);
    if (!sec) errs.push(`المنيو سطر ${n}: القسم فارغ.`);
    if (!name) errs.push(`المنيو سطر ${n}: اسم الصنف فارغ.`);
    if (isNaN(price) || price < 0) errs.push(`المنيو سطر ${n}: السعر لازم يكون رقم (مثال 85).`);
    const key = [sec, name, variant].join('|');
    if (seen.has(key)) errs.push(`المنيو سطر ${n}: الصنف «${name}» مكرر في نفس القسم.`);
    seen.add(key);
    items.push({ sec, name, desc: s(r[2]), price, variant, av: s(r[5]) !== 'لا' });
  });
  if (!items.length) errs.push('المنيو: مفيش أصناف.');
  return { place, items, errs };
}

function render() {
  const { place, items, errs } = current, el = $('prev');
  let h = '';
  if (errs.length) h += `<div class="msg err"><b>صحّح الأخطاء دي في الملف وارفعه تاني:</b><ul class="errs">${errs.slice(0, 30).map(e => `<li>${esc(e)}</li>`).join('')}</ul>${errs.length > 30 ? `<div>و${errs.length - 30} أخطاء أخرى.</div>` : ''}</div>`;
  if (place) h += `<p><b>${esc(place.name)}</b> - ${esc(place.type)} - ${items.length} صنف - آخر تحديث للأسعار: ${esc(place.prices_updated_at || '-')}</p>`;
  if (items.length) h += `<div class="tw"><table><tr><th>القسم</th><th>الصنف</th><th>الحجم</th><th>السعر</th><th>متاح</th></tr>${items.slice(0, 200).map(x =>
    `<tr><td>${esc(x.sec)}</td><td>${esc(x.name)}</td><td>${esc(x.variant)}</td><td>${isNaN(x.price) ? '؟' : x.price}</td><td>${x.av ? 'نعم' : 'لا'}</td></tr>`).join('')}</table></div>`;
  if (!errs.length) h += `<p><button id="save">حفظ المنيو (غير منشور)</button></p><div id="smsg"></div>`;
  el.innerHTML = h;
  if (!errs.length) $('save').onclick = save;
}

/* ---------- save ---------- */
async function save() {
  const btn = $('save'), out = $('smsg'); btn.disabled = true;
  const { place, items } = current;
  const { data: pl, error: e1 } = await db.from('places')
    .insert({ ...place, slug: 'p-' + Date.now().toString(36), is_published: false }).select('id').single();
  if (e1) { btn.disabled = false; return show(out, 'تعذر الحفظ: ' + esc(e1.message), 'err'); }
  try {
    const names = [...new Set(items.map(x => x.sec))];
    const { data: sd, error: e2 } = await db.from('sections')
      .insert(names.map((name, i) => ({ place_id: pl.id, name, sort_order: i }))).select('id,name');
    if (e2) throw e2;
    const map = Object.fromEntries(sd.map(x => [x.name, x.id]));
    const { error: e3 } = await db.from('items').insert(items.map((x, i) => ({
      place_id: pl.id, section_id: map[x.sec], name: x.name, description: x.desc || null,
      price: x.price, variant: x.variant || null, is_available: x.av, sort_order: i })));
    if (e3) throw e3;
    show(out, 'تم الحفظ. المكان غير منشور؛ راجعه من قائمة الأماكن ثم اضغط «نشر».', 'ok');
    $('file').value = ''; loadList();
  } catch (e) {
    await db.from('places').delete().eq('id', pl.id);
    btn.disabled = false; show(out, 'تعذر الحفظ ولم يتم حفظ أي شيء: ' + esc(e.message), 'err');
  }
}

/* ---------- places list ---------- */
async function loadList() {
  const { data, error } = await db.from('places')
    .select('id,name,type,is_published,prices_updated_at').order('created_at', { ascending: false });
  const el = $('list');
  if (error) return show(el, 'تعذر تحميل الأماكن: ' + esc(error.message), 'err');
  if (!data.length) { el.innerHTML = '<p class="tag">لسه مفيش أماكن. ارفع أول منيو من فوق.</p>'; return; }
  el.innerHTML = data.map(p => `<div class="row"><div><b>${esc(p.name)}</b> <span class="tag">${esc(p.type)} - ${p.is_published ? 'منشور' : 'غير منشور'} - أسعار: ${esc(p.prices_updated_at || '-')}</span></div>
    <div><button class="sec" data-t="${p.id}" data-p="${p.is_published}">${p.is_published ? 'إلغاء النشر' : 'نشر'}</button>
    <button class="del" data-d="${p.id}">حذف</button></div></div>`).join('');
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
    await db.from('places').update({ is_published: b.dataset.p !== 'true' }).eq('id', b.dataset.t); loadList(); });
  el.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    if (confirm('حذف المكان وكل أصنافه نهائياً؟')) { await db.from('places').delete().eq('id', b.dataset.d); loadList(); } });
}

gate();
</script>
</body>
</html>
